name: Build Surface Pro 6 Live ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'iso.nix'
      - 'scripts/**'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          df -h

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Lock inputs
        run: nix flake lock

      - name: Evaluate configuration
        run: nix eval .#nixosConfigurations.surface-pro6-live.config.system.build.isoImage.drvPath

      - name: Build ISO
        run: nix build .#surface-pro6-iso -L --print-build-logs

      - name: Collect ISO and checksums
        run: |
          mkdir -p dist
          cp -L result/iso/*.iso dist/
          cd dist
          sha256sum *.iso > SHA256SUMS
          ls -lh
          df -h

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-surface-pro6-live
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Prepare GitHub Release assets
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p release-dist
          ISO="$(find dist -maxdepth 1 -type f -name '*.iso' -print -quit)"
          ISO_NAME="$(basename "$ISO")"
          cp dist/SHA256SUMS release-dist/
          split -b 1900M -d -a 2 "$ISO" "release-dist/${ISO_NAME}.part-"
          (cd release-dist && sha256sum "${ISO_NAME}.part-"* > PARTS-SHA256SUMS)
          printf '%s\n' \
            'GitHub limits each Release asset to less than 2 GiB, so the ISO is split into numbered parts.' \
            'Linux/macOS: cat *.part-* > nixos-surface-pro6-live.iso' \
            'Windows CMD: copy /b <part-00>+<part-01> nixos-surface-pro6-live.iso' \
            'After reassembly, verify the ISO against SHA256SUMS.' \
            > release-dist/REASSEMBLE.txt
          ls -lh release-dist

      - name: Publish rolling test release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete live-latest --cleanup-tag -y || true
          gh release create live-latest release-dist/* --title "Surface Pro 6 Live - latest" --notes "Automated test build from commit $GITHUB_SHA. The complete ISO is also retained as a workflow artifact for 7 days. GitHub Release assets are split below the 2 GiB per-file limit; see REASSEMBLE.txt. Boot as a live ISO; do not install during hardware validation."
